name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas unitarias (clasificador y categorías)
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee build-logs/pruebas-unitarias.txt \
            || { bash scripts/report-errors.sh build-logs/pruebas-unitarias.txt; exit 1; }

      - name: Compilar APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease assembleDebugAndroidTest 2>&1 | tee build-logs/compilacion.txt \
            || { bash scripts/report-errors.sh build-logs/compilacion.txt; exit 1; }

      - name: Guardar APKs
        uses: actions/upload-artifact@v6
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Guardar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-pruebas-unitarias
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/device-check.sh

      - name: Guardar capturas y registros del emulador
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulador
          path: device-output/
          if-no-files-found: ignore

      - name: Dejar resultados en la rama ci-resultados
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/res && mkdir -p /tmp/res/test-results
          cp -r device-output build-logs /tmp/res/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/res/test-results/unitarias 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results /tmp/res/test-results/interfaz 2>/dev/null || true
          rm -f /tmp/res/device-output/ui.xml
          echo "Compilación ${{ github.run_number }} · commit ${{ github.sha }} · estado ${{ job.status }}" > /tmp/res/INFO.txt
          cd /tmp/res
          git init -q -b ci-resultados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resultados de la compilación ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ci-resultados

      - name: Publicar APK en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk buenorden.apk
          cat > notas.md <<NOTES
          **Para instalar:** abre este enlace desde tu teléfono Android, toca \`buenorden.apk\`, ábrelo y acepta *Instalar*.
          Si Android pregunta, permite instalar apps de esta fuente.

          Compilación ${VERSION} · commit ${GITHUB_SHA::7} · pasó las pruebas unitarias, de interfaz y en emulador.
          NOTES
          gh release create "$VERSION" buenorden.apk --title "BuenOrden $VERSION" --notes-file notas.md --latest
