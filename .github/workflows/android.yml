name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias (clasificador y categorías)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Compilar APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Guardar APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Guardar reporte de pruebas unitarias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-unitarias
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/device-check.sh

      - name: Guardar capturas y registros del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador
          path: device-output/
          if-no-files-found: ignore

      - name: Publicar APK en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk ordena.apk
          cat > notas.md <<NOTES
          **Para instalar:** abre este enlace desde tu teléfono Android, toca \`ordena.apk\`, ábrelo y acepta *Instalar*.
          Si Android pregunta, permite instalar apps de esta fuente.

          Compilación ${VERSION} · commit ${GITHUB_SHA::7} · pasó las pruebas unitarias, de interfaz y en emulador.
          NOTES
          gh release create "$VERSION" ordena.apk --title "Ordena $VERSION" --notes-file notas.md --latest
